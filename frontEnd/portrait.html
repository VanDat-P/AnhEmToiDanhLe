<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chấm Điểm Tranh</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portrait.css">
</head>
<body>

    <div class="main-card" id="grading-card" >
        <div class="header">
            <div class="icon-wrapper">🎨</div>
            <h2 id="title">Chấm điểm tranh</h2>
            <p class="subtitle">Hệ thống chấm điểm tranh vẽ bằng AI</p>
        </div>

        <div class="content">
            <div class="upload-box">
                <label for="image">
                    <span>Hãy chọn bức tranh của bạn</span>
                    <small>(JPG, PNG)</small>
                </label>
                <input id="image" type="file" accept="image/*">
            </div>

            <button id="submit" type="button" class="btn-primary">
                Bắt đầu chấm điểm nhé!
            </button>
            
            <button id="reset-btn" class="btn-secondary" style="margin-top:10px;">
                    🔄 Chấm bức tranh khác
            </button>

            <img id="preview" style="max-width:300px; display:none; margin-top:10px;">

            <div id="result" class="result-container">
                <span class="placeholder-text">Kết quả của bạn sẽ là gì đây nào?...</span>
            </div>
        </div>
    </div>

    <script src="portrait.js"></script>
</body>
</html>
